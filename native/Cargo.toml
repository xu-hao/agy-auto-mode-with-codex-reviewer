[package]
name = "antigravity-guardian-review"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[[bin]]
name = "guardian-review"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1" }
codex-analytics = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-api = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-client = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-context-fragments = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-guardian-context = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-guardian-reviewer = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-login = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-model-provider = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-model-provider-info = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-models-manager = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-prompts = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
codex-protocol = { git = "https://github.com/openai/codex.git", rev = "970111f6cb62cc02fe36a82ea7d71b37a2889c97" }
futures = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
