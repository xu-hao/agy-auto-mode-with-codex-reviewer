[package]
name = "antigravity-guardian-review"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[[bin]]
name = "guardian-review"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1" }
codex-analytics = { path = "../vendor/codex/codex-rs/analytics" }
codex-api = { path = "../vendor/codex/codex-rs/codex-api" }
codex-client = { path = "../vendor/codex/codex-rs/codex-client" }
codex-context-fragments = { path = "../vendor/codex/codex-rs/context-fragments" }
codex-guardian-context = { path = "../vendor/codex/codex-rs/guardian-context" }
codex-guardian-reviewer = { path = "../vendor/codex/codex-rs/ext/guardian-reviewer" }
codex-http-client = { path = "../vendor/codex/codex-rs/http-client" }
codex-login = { path = "../vendor/codex/codex-rs/login" }
codex-model-provider = { path = "../vendor/codex/codex-rs/model-provider" }
codex-model-provider-info = { path = "../vendor/codex/codex-rs/model-provider-info" }
codex-models-manager = { path = "../vendor/codex/codex-rs/models-manager" }
codex-prompts = { path = "../vendor/codex/codex-rs/prompts" }
codex-protocol = { path = "../vendor/codex/codex-rs/protocol" }
futures = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
